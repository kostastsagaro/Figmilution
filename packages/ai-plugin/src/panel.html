<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #202020;
      --panel: #292929;
      --panel-2: #303030;
      --line: #3b3b3b;
      --text: #e4e4e4;
      --muted: #9a9a9a;
      --accent: #7dd3fc;
      --accent-strong: #38bdf8;
      --danger: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 220px;
      min-height: 220px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0;
      overflow: hidden;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 220px;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 650;
      color: #f4f4f4;
    }

    .mark {
      width: 18px;
      height: 18px;
      border: 1px solid #5c5c5c;
      border-radius: 4px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: #242424;
      font-size: 11px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
    }

    .connection-dot.connected { background: #65d46e; }
    .connection-dot.error { background: var(--danger); }

    main {
      padding: 10px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
      min-height: 0;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      appearance: none;
      border: 1px solid #474747;
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      min-height: 58px;
      padding: 8px 6px;
      display: grid;
      place-items: center;
      gap: 4px;
      cursor: pointer;
      font: inherit;
    }

    button svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }

    button .label {
      font-size: 11px;
      line-height: 1.1;
      white-space: normal;
      text-align: center;
    }

    button:hover:not(:disabled) {
      border-color: #5f5f5f;
      background: var(--panel-2);
      color: #fff;
    }

    button.primary {
      color: #dff6ff;
      border-color: #3b6f83;
      background: #26343a;
    }

    button.primary:hover:not(:disabled) {
      border-color: var(--accent-strong);
      background: #293d45;
    }

    button:disabled {
      opacity: .42;
      cursor: default;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #242424;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--accent-strong);
    }

    .pending {
      min-height: 54px;
      padding: 8px;
      border-radius: 6px;
      background: #181818;
      border: 1px solid #303030;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow: auto;
    }

    footer {
      border-top: 1px solid var(--line);
      background: #181818;
      padding: 7px 10px;
      height: auto;
      min-height: 32px;
      max-height: 200px;
      display: flex;
      align-items: flex-start;
      overflow-y: scroll;
    }

    #status {
      width: 100%;
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-wrap: break-word;
      user-select: text;
      cursor: text;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      line-height: 1.35;
    }

    #status.ok  { color: #8ee89a; }
    #status.err {
      color: #ffb3b3;
      background: #2a1010;
      padding: 4px 6px;
      border-radius: 4px;
    }

    #tooltip {
      position: fixed;
      z-index: 20;
      max-width: 190px;
      padding: 6px 7px;
      border-radius: 5px;
      background: #111;
      border: 1px solid #4a4a4a;
      color: #f2f2f2;
      font-size: 11px;
      line-height: 1.25;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -6px);
      transition: opacity 80ms ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, .35);
    }

    #tooltip.visible { opacity: 1; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="mark">B</div>
        <div>Bridge</div>
      </div>
      <div id="connection-dot" class="connection-dot"></div>
    </header>

    <main>
      <div class="actions">
        <button id="pull-btn" class="primary" disabled data-tooltip="Render incoming Figma design">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v11"></path>
            <path d="m7 10 5 5 5-5"></path>
            <path d="M5 20h14"></path>
          </svg>
          <span class="label">Pull</span>
        </button>

        <button id="push-btn" disabled data-tooltip="Send selected Illustrator items out">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20V9"></path>
            <path d="m7 14 5-5 5 5"></path>
            <path d="M5 4h14"></path>
          </svg>
          <span class="label">Push</span>
        </button>
      </div>

      <div class="options">
        <label class="toggle" data-tooltip="Render incoming Figma payloads immediately">
          <input id="auto-render" type="checkbox" />
          <span>Auto-Render</span>
        </label>
      </div>

      <div id="pending-info" class="pending">No incoming payload.</div>
    </main>

    <footer>
      <div id="status">Connecting...</div>
    </footer>
  </div>

  <div id="tooltip"></div>

  <script src="CSInterface.js"></script>
  <script src="panel.js"></script>
</body>
</html>
